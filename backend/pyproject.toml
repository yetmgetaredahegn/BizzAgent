[project]
name = "bizzagent"
version = "0.1.0"
description = "BizzAgent backend: voice-first agentic business helper (FastAPI + LangGraph)"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
# Local speech stack (dev); production uses hosted speech APIs.
speech = [
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "transformers>=5.16.1",
]
vision = ["easyocr>=1.7.2"]
# Local models for testing; production uses hosted model APIs.
llm-local = ["langchain-ollama>=1.1.0"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bizzagent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
