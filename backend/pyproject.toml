[project]
name = "bizzagent"
version = "0.1.0"
description = "BizzAgent backend: voice-first agentic business helper (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "sqlalchemy>=2.0",
    "pyjwt>=2.15.1",
    "psycopg[binary]>=3.2",
]

# Optional extras will be re-added as feature code is implemented.
# [project.optional-dependencies]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "import-linter>=2.15",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bizzagent"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI declares parameters with File(...)/Form(...) defaults by design.
ignore = ["B008"]

# [tool.ruff.lint.per-file-ignores]
# (none at this time — legacy code has been removed)

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_package = "bizzagent"
include_external_packages = true

# Module boundaries (ADR-0036). Run with `uv run lint-imports`.
[[tool.importlinter.contracts]]
name = "core, shared and integrations never import modules"
type = "forbidden"
source_modules = ["bizzagent.core", "bizzagent.shared", "bizzagent.integrations"]
forbidden_modules = ["bizzagent.modules"]

[[tool.importlinter.contracts]]
name = "Platform modules and the agent runtime never import product modules"
type = "forbidden"
source_modules = [
    "bizzagent.modules.accounts",
    "bizzagent.modules.billing",
    "bizzagent.modules.artifacts",
    "bizzagent.modules.documents",
    "bizzagent.modules.knowledge",
    "bizzagent.modules.calc",
    "bizzagent.modules.memory",
    "bizzagent.modules.activity",
    "bizzagent.modules.agents",
]
forbidden_modules = [
    "bizzagent.modules.learn",
    "bizzagent.modules.start",
    "bizzagent.modules.plan",
    "bizzagent.modules.funding",
    "bizzagent.modules.opportunities",
    "bizzagent.modules.trust",
    "bizzagent.modules.money",
    "bizzagent.modules.personal",
    "bizzagent.modules.team",
    "bizzagent.modules.markets",
]

[[tool.importlinter.contracts]]
name = "Pure code imports no model frameworks or integrations"
type = "forbidden"
source_modules = [
    "bizzagent.modules.calc",
    "bizzagent.modules.knowledge",
    # Add funding.rules and start.rules back when those sub-packages are created.
]
forbidden_modules = ["langchain", "langchain_core", "langgraph", "bizzagent.integrations"]

[[tool.importlinter.contracts]]
name = "Only the app entry point imports the personal space"
type = "protected"
protected_modules = ["bizzagent.modules.personal"]
allowed_importers = ["bizzagent.main"]

[[tool.importlinter.contracts]]
name = "accounts: other code imports only the package root"
type = "protected"
protected_modules = ["bizzagent.modules.accounts.*"]
allowed_importers = ["bizzagent.modules.accounts"]

